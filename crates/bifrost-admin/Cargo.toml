[package]
name = "bifrost-admin"
version = "0.0.166"
edition = "2021"
description = "Admin API and web interface for Bifrost proxy"

[dependencies]
bifrost-agent = { path = "../agent" }
bifrost-skills = { package = "skills", path = "../skills" }
bifrost-command = { path = "../bifrost-command" }
bifrost-core = { path = "../bifrost-core" }
bifrost-tls = { path = "../bifrost-tls" }
bifrost-storage = { path = "../bifrost-storage" }
bifrost-sync = { path = "../bifrost-sync" }
bifrost-device = { path = "../bifrost-device" }
bifrost-script = { path = "../bifrost-script" }
bifrost-power = { path = "../bifrost-power" }
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = ["core"] }

tokio = { version = "1", features = ["full", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing = "0.1"
ipnet.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
sysinfo = "0.31"
urlencoding = "2"
url = "2"
qrcode = "0.14"
base64 = "0.22"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
md5 = "0.7"
regex = "1"
ignore = "0.4"
dashmap = "6"
futures-util = { version = "0.3", features = ["sink"] }
sha1 = "0.10"
sha2 = "0.10"
blake3 = "1"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
lru.workspace = true
flate2 = "1"
tar = "0.4"
brotli = "7"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "stream",
] }
ureq.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
once_cell.workspace = true
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
bcrypt = "0.17"
rand.workspace = true
gethostname = "1"
ring = "0.17"
async-trait.workspace = true
prost = "0.13"
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.3"
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSData",
  "NSDictionary",
  "NSGeometry",
  "NSRange",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace",
  "NSImage",
  "NSBitmapImageRep",
] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = [
  "full-local-asr",
] }

[target.'cfg(target_os = "windows")'.dependencies]
pelite = "0.10"
ico = "0.3"
image = { version = "0.25", default-features = false, features = [
  "ico",
  "png",
] }
local-ip-address = "0.6.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["net", "process", "signal"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
flate2 = "1"

[features]
default = ["skills-crud"]
skills-crud = []
test-support = []
