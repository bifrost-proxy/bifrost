[package]
name = "bifrost-agent"
version.workspace = true
edition.workspace = true
description = "Shared session and persistence support for Bifrost external runners"

[dependencies]
bifrost-core = { path = "../bifrost-core" }
bifrost-skills = { package = "skills", path = "../skills" }
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0"
dashmap = "6"
include_dir = "0.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2.5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
