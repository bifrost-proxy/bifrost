[package]
name = "bifrost-agent"
version.workspace = true
edition.workspace = true
description = "AI Agent runtime for Bifrost with tool calling, multi-turn dialogue, and memory compaction"

[dependencies]
bifrost-core = { path = "../bifrost-core" }
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0"
dashmap = "6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
