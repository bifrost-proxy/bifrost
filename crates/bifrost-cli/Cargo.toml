[package]
name = "bifrost-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for Bifrost proxy"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
bifrost-admin = { path = "../bifrost-admin" }
bifrost-command = { path = "../bifrost-command" }
bifrost-core = { path = "../bifrost-core" }
bifrost-device = { path = "../bifrost-device" }
bifrost-proxy = { path = "../bifrost-proxy" }
bifrost-sync = { path = "../bifrost-sync" }
bifrost-tls = { path = "../bifrost-tls" }
bifrost-storage = { path = "../bifrost-storage" }
bifrost-script = { path = "../bifrost-script" }
bifrost-power = { path = "../bifrost-power" }
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = ["core"] }
parking_lot.workspace = true
tracing.workspace = true
notify = "6"
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
dialoguer = "0.11"
bcrypt = "0.17"
toml.workspace = true
ipnet.workspace = true
bytes.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
urlencoding = "2.1"
url.workspace = true
regex = "1"
futures = "0.3"
reqwest.workspace = true
ureq.workspace = true
chrono.workspace = true
colored = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
ratatui = { version = "0.30.1", features = ["crossterm_0_28"] }
crossterm = "0.28"
tokio-tungstenite = "0.26"
base64 = "0.22"
ring = "0.17"
zstd = "0.13"
uuid.workspace = true
fs2 = "0.4"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process", "fs"] }
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = ["full-local-asr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# --- System tray helper (in-process via `bifrost __tray`) ---
[target.'cfg(not(target_os = "linux"))'.dependencies]
open = "5"
arboard = "3"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.19"
muda = "0.15"
tao = { version = "0.31", default-features = false }
sysinfo = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.19"
muda = "0.15"
tao = { version = "0.31", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
