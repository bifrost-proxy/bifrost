[package]
name = "bifrost-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for Bifrost proxy"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "bifrost"
path = "src/main.rs"

[dependencies]
bifrost-admin = { path = "../bifrost-admin" }
bifrost-command = { path = "../bifrost-command" }
bifrost-core = { path = "../bifrost-core" }
bifrost-device = { path = "../bifrost-device" }
bifrost-proxy = { path = "../bifrost-proxy" }
bifrost-sync = { path = "../bifrost-sync" }
bifrost-tls = { path = "../bifrost-tls" }
bifrost-storage = { path = "../bifrost-storage" }
bifrost-script = { path = "../bifrost-script" }
bifrost-power = { path = "../bifrost-power" }
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = ["core"] }
parking_lot.workspace = true
tracing.workspace = true
notify = "6"
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
dialoguer = "0.11"
bcrypt = "0.17"
toml.workspace = true
ipnet.workspace = true
bytes.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
urlencoding = "2.1"
regex = "1"
futures = "0.3"
reqwest.workspace = true
ureq.workspace = true
chrono.workspace = true
colored = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
ratatui = "0.29"
crossterm = "0.28"
tokio-tungstenite = "0.26"
base64 = "0.22"
ring = "0.17"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process", "fs"] }
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
bifrost-asr = { path = "../bifrost-asr", default-features = false, features = ["full-local-asr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading"] }
