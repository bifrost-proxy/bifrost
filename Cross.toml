[build.env]
passthrough = [
    "SKIP_FRONTEND_BUILD",
    "CARGO_TERM_COLOR",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "set -eux; sed -i -e 's|http://archive.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://security.archive.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true; apt-get -o Acquire::Retries=5 update; apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang libclang-dev || (apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --fix-missing --no-install-recommends clang libclang-dev)",
]
