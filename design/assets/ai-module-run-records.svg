    <path d="M22 273h12v12H22zM25 270v18M19 276h18" fill="none" stroke="#6da0f0" stroke-width="1.4" stroke-linecap="round"/>
    <text x="52" y="329" class="nav">Settings</text>
    <circle cx="28" cy="324" r="7" fill="none" stroke="#71807a" stroke-width="1.5"/>
  </g>
  <g transform="translate(20 892)">
    <circle cx="14" cy="14" r="5" fill="#52c41a"/>
