    <g transform="translate(0 730)">
      <rect width="1104" height="48" rx="8" fill="#f0f4f3"/>
      <circle cx="24" cy="24" r="8" fill="none" stroke="#65716d" stroke-width="1.4"/>
      <text x="24" y="28" text-anchor="middle" fill="#65716d" font-size="11" font-weight="700">i</text>
      <text x="44" y="29" class="note">摘要列表是信息终点：记录行无 hover、无点击、无展开，也不会请求消息、日志或 Agent 内部详情。</text>
      <rect x="982" y="8" width="106" height="32" rx="6" fill="#ffffff" stroke="#c5d2cb"/>
      <text x="1035" y="29" text-anchor="middle" fill="#3578e5" font-size="12" font-weight="600">加载更多</text>
    </g>
