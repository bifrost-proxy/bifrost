        <circle cx="28" cy="38" r="4" fill="#13a58f"/>
        <text x="40" y="42" class="status">运行中</text>
        <text x="122" y="35" class="cell-strong">整理本周发布计划</text>
        <text x="122" y="55" class="cell-muted">feishu:release-planning</text>
        <text x="416" y="42" class="cell">Codex</text>
        <text x="558" y="42" class="cell">08:54</text>
        <text x="686" y="42" class="cell" text-anchor="middle">4</text>
        <rect x="766" y="24" width="48" height="24" rx="12" fill="#edf4ff"/>
        <text x="790" y="41" text-anchor="middle" fill="#3578e5" font-size="12">飞书</text>
        <text x="928" y="42" class="cell">14:32</text>
      </g>
      <line x1="16" y1="126" x2="1088" y2="126" stroke="#edf0ee"/>

      <g transform="translate(0 126)">
        <circle cx="28" cy="38" r="4" fill="#13a58f"/>
        <text x="40" y="42" class="status">运行中</text>
        <text x="122" y="35" class="cell-strong">分析凌晨 CI 失败原因</text>
        <text x="122" y="55" class="cell-muted">web:ci-investigation</text>
        <text x="416" y="42" class="cell">Claude Code</text>
        <text x="558" y="42" class="cell">03:16</text>
        <text x="686" y="42" class="cell" text-anchor="middle">2</text>
        <rect x="766" y="24" width="48" height="24" rx="12" fill="#f0f4f3"/>
        <text x="790" y="41" text-anchor="middle" fill="#4e5b57" font-size="12">Web</text>
        <text x="928" y="42" class="cell">14:25</text>
      </g>
      <line x1="16" y1="204" x2="1088" y2="204" stroke="#edf0ee"/>

      <g transform="translate(0 204)">
        <circle cx="28" cy="38" r="4" fill="#3578e5"/>
        <text x="40" y="42" class="status">已完成</text>
        <text x="122" y="35" class="cell-strong">补充远程调用文档</text>
        <text x="122" y="55" class="cell-muted">weixin:docs-thread</text>
        <text x="416" y="42" class="cell">Trae X</text>
        <text x="558" y="42" class="cell">12:41</text>
        <text x="686" y="42" class="cell" text-anchor="middle">6</text>
        <rect x="766" y="24" width="48" height="24" rx="12" fill="#e8f7f3"/>
        <text x="790" y="41" text-anchor="middle" fill="#137e6e" font-size="12">微信</text>
        <text x="928" y="42" class="cell">13:48</text>
      </g>
      <line x1="16" y1="282" x2="1088" y2="282" stroke="#edf0ee"/>

      <g transform="translate(0 282)">
        <circle cx="28" cy="38" r="4" fill="#cf1322"/>
        <text x="40" y="42" class="status">失败</text>
        <text x="122" y="35" class="cell-strong">检查代理证书状态</text>
        <text x="122" y="55" class="cell-muted">api:certificate-check</text>
        <text x="416" y="42" class="cell">Codex</text>
        <text x="558" y="42" class="cell">00:27</text>
        <text x="686" y="42" class="cell" text-anchor="middle">1</text>
        <rect x="766" y="24" width="44" height="24" rx="12" fill="#fff4e8"/>
        <text x="788" y="41" text-anchor="middle" fill="#a65d16" font-size="12">API</text>
        <text x="928" y="42" class="cell">13:22</text>
      </g>
      <line x1="16" y1="360" x2="1088" y2="360" stroke="#edf0ee"/>

      <g transform="translate(0 360)">
        <circle cx="28" cy="38" r="4" fill="#8c8c8c"/>
        <text x="40" y="42" class="status">已停止</text>
        <text x="122" y="35" class="cell-strong">生成周会摘要</text>
        <text x="122" y="55" class="cell-muted">schedule:weekly-summary</text>
        <text x="416" y="42" class="cell">Codex</text>
        <text x="558" y="42" class="cell">04:08</text>
        <text x="686" y="42" class="cell" text-anchor="middle">3</text>
        <rect x="766" y="24" width="72" height="24" rx="12" fill="#f0f4f3"/>
        <text x="802" y="41" text-anchor="middle" fill="#4e5b57" font-size="12">定时任务</text>
        <text x="928" y="42" class="cell">12:57</text>
