<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost AI 模块首页视觉稿</title>
  <desc id="desc">Bifrost WebUI 的 AI 首页，左侧保留全局导航，主内容以二乘二卡片展示 ASR、IM 通道、Agent 配置和运行记录。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page-title { fill: #111816; font-size: 28px; font-weight: 700; }
    .page-copy { fill: #5d6965; font-size: 14px; }
    .nav { fill: #aebbb6; font-size: 14px; }
    .nav-active { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .card-title { fill: #111816; font-size: 18px; font-weight: 700; }
    .card-copy { fill: #5d6965; font-size: 13px; }
    .metric { fill: #111816; font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .metric-label { fill: #6d7975; font-size: 12px; }
    .detail { fill: #36413e; font-size: 13px; }
    .caption { fill: #7a8581; font-size: 11px; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#12221e" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="12" fill="#f5f6f8"/>
  <rect width="1440" height="48" rx="12" fill="#ffffff"/>
  <rect y="36" width="1440" height="12" fill="#ffffff"/>
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>
  <text x="720" y="30" text-anchor="middle" fill="#6d7975" font-size="12">Bifrost WebUI · AI</text>
  <line x1="0" y1="48" x2="1440" y2="48" stroke="#dce4df"/>

  <rect y="48" width="224" height="852" fill="#111816"/>
  <g transform="translate(24 78)">
    <rect width="36" height="36" rx="8" fill="#13a58f"/>
    <path d="M10 12h16M10 18h11M10 24h16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="24" fill="#ffffff" font-size="18" font-weight="700">Bifrost</text>
  </g>
  <g>
    <text x="24" y="154" fill="#67746f" font-size="11" font-weight="700" letter-spacing="1">WORKBENCH</text>
    <text x="52" y="193" class="nav">Traffic</text>
    <circle cx="28" cy="188" r="7" fill="none" stroke="#71807a" stroke-width="1.5"/>
    <path d="M25 188h6M28 185v6" stroke="#71807a" stroke-width="1.2"/>
    <text x="52" y="237" class="nav">Rules</text>
    <path d="M21 226h14v14H21zM25 230h6M25 234h4" fill="none" stroke="#71807a" stroke-width="1.5"/>
    <rect x="12" y="258" width="200" height="42" rx="6" fill="#213d39"/>
    <rect x="12" y="258" width="3" height="42" rx="1.5" fill="#3578e5"/>
    <text x="52" y="284" class="nav-active">AI</text>
    <path d="M22 273h12v12H22zM25 270v18M19 276h18" fill="none" stroke="#6da0f0" stroke-width="1.4" stroke-linecap="round"/>
    <text x="52" y="329" class="nav">Settings</text>
    <circle cx="28" cy="324" r="7" fill="none" stroke="#71807a" stroke-width="1.5"/>
    <circle cx="28" cy="324" r="2" fill="#71807a"/>
  </g>
  <g transform="translate(20 832)">
    <circle cx="14" cy="14" r="5" fill="#52c41a"/>
    <text x="30" y="18" fill="#aebbb6" font-size="12">Proxy running</text>
  </g>

  <g transform="translate(288 112)">
    <text x="0" y="34" class="page-title">AI</text>
    <text x="0" y="63" class="page-copy">连接外部 Agent 能力，管理入口并查看运行概况。</text>

    <g transform="translate(0 112)" filter="url(#shadow)">
      <rect width="536" height="260" rx="8" fill="#ffffff" stroke="#dce4df"/>
      <circle cx="42" cy="42" r="20" fill="#e8f7f3"/>
      <path d="M35 43c0 10 14 10 14 0v-6c0-10-14-10-14 0v6zM42 52v8M35 60h14" fill="none" stroke="#13a58f" stroke-width="2" stroke-linecap="round"/>
      <text x="78" y="39" class="card-title">ASR</text>
      <text x="78" y="62" class="card-copy">语音识别、转写任务与语音资源</text>
      <text x="496" y="48" fill="#3578e5" font-size="24">→</text>
      <line x1="24" y1="90" x2="512" y2="90" stroke="#edf0ee"/>
      <text x="32" y="125" class="metric-label">服务状态</text>
      <circle cx="38" cy="151" r="5" fill="#52c41a"/>
      <text x="51" y="156" class="detail" font-weight="600">正常</text>
      <text x="218" y="125" class="metric-label">处理中</text>
      <text x="218" y="158" class="metric">2</text>
      <text x="390" y="125" class="metric-label">最近完成</text>
      <text x="390" y="156" class="detail" font-weight="600">12 分钟前</text>
      <rect x="24" y="199" width="488" height="37" rx="6" fill="#f7f9f8"/>
      <text x="38" y="223" class="caption">设备能力可用 · 8 个转写任务</text>
    </g>

    <g transform="translate(560 112)" filter="url(#shadow)">
      <rect width="536" height="260" rx="8" fill="#ffffff" stroke="#dce4df"/>
      <circle cx="42" cy="42" r="20" fill="#edf4ff"/>
      <path d="M32 32h20a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H42l-7 6v-6h-3a5 5 0 0 1-5-5V37a5 5 0 0 1 5-5z" fill="none" stroke="#3578e5" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="78" y="39" class="card-title">IM 通道</text>
      <text x="78" y="62" class="card-copy">连接飞书、微信等消息来源</text>
      <text x="496" y="48" fill="#3578e5" font-size="24">→</text>
      <line x1="24" y1="90" x2="512" y2="90" stroke="#edf0ee"/>
      <text x="32" y="125" class="metric-label">已连接</text>
      <text x="32" y="158" class="metric">3 / 4</text>
      <text x="218" y="125" class="metric-label">异常</text>
      <text x="218" y="158" class="metric" fill="#d57926">1</text>
      <text x="390" y="125" class="metric-label">通道类型</text>
      <text x="390" y="156" class="detail" font-weight="600">飞书 · 微信</text>
      <rect x="24" y="199" width="488" height="37" rx="6" fill="#fff8ef"/>
      <circle cx="40" cy="218" r="4" fill="#fa8c16"/>
      <text x="52" y="223" class="caption" fill="#9a5b17">1 个通道需要处理</text>
    </g>

    <g transform="translate(0 396)" filter="url(#shadow)">
      <rect width="536" height="260" rx="8" fill="#ffffff" stroke="#dce4df"/>
      <circle cx="42" cy="42" r="20" fill="#fff4e8"/>
      <circle cx="42" cy="42" r="7" fill="none" stroke="#d57926" stroke-width="1.8"/>
      <path d="M42 28v6M42 50v6M28 42h6M50 42h6M32 32l5 5M47 47l5 5M52 32l-5 5M37 47l-5 5" stroke="#d57926" stroke-width="1.8" stroke-linecap="round"/>
      <text x="78" y="39" class="card-title">Agent 配置</text>
      <text x="78" y="62" class="card-copy">管理外部 Runner 与运行策略</text>
      <text x="496" y="48" fill="#3578e5" font-size="24">→</text>
      <line x1="24" y1="90" x2="512" y2="90" stroke="#edf0ee"/>
      <text x="32" y="125" class="metric-label">已启用 Runner</text>
      <text x="32" y="158" class="metric">4</text>
      <text x="218" y="125" class="metric-label">默认 Runner</text>
      <text x="218" y="156" class="detail" font-weight="600">Codex</text>
      <text x="390" y="125" class="metric-label">配置状态</text>
      <circle cx="396" cy="151" r="5" fill="#52c41a"/>
      <text x="409" y="156" class="detail" font-weight="600">健康</text>
      <rect x="24" y="199" width="488" height="37" rx="6" fill="#f7f9f8"/>
      <text x="38" y="223" class="caption">Codex · Claude Code · Trae X · +1</text>
    </g>

    <g transform="translate(560 396)" filter="url(#shadow)">
      <rect width="536" height="260" rx="8" fill="#ffffff" stroke="#b9cbe9" stroke-width="1.5"/>
      <circle cx="42" cy="42" r="20" fill="#f0f4f3"/>
      <circle cx="42" cy="42" r="11" fill="none" stroke="#111816" stroke-width="1.8"/>
      <path d="M42 35v8l6 4" fill="none" stroke="#111816" stroke-width="1.8" stroke-linecap="round"/>
      <text x="78" y="39" class="card-title">运行记录</text>
      <text x="78" y="62" class="card-copy">外部 Agent 线程的基础运行摘要</text>
      <text x="496" y="48" fill="#3578e5" font-size="24">→</text>
      <line x1="24" y1="90" x2="512" y2="90" stroke="#edf0ee"/>
      <text x="32" y="125" class="metric-label">正在运行</text>
      <text x="32" y="158" class="metric" fill="#13a58f">3</text>
      <text x="218" y="125" class="metric-label">累计记录</text>
      <text x="218" y="158" class="metric">128</text>
      <text x="390" y="125" class="metric-label">Runner</text>
      <text x="390" y="156" class="detail" font-weight="600">Codex · Trae X</text>
      <rect x="24" y="199" width="488" height="37" rx="6" fill="#f7f9f8"/>
      <circle cx="40" cy="218" r="4" fill="#13a58f"/>
      <text x="52" y="223" class="caption">刚刚更新 · Claude Code +1</text>
    </g>
  </g>
</svg>
