name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "docs-en/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "docs-en/**"
      - "assets/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          BASE_PATH_OVERRIDE: ${{ vars.BASE_PATH }}
        run: |
          if [ -n "$BASE_PATH_OVERRIDE" ]; then
            export BASE_PATH="$BASE_PATH_OVERRIDE"
          fi
          pnpm run build
        working-directory: site
