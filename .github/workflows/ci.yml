name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

  clippy:
    name: Rust Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: always()
      - name: Unit and integration tests
        run: cargo test --workspace --all-features

  build-e2e:
    name: Build E2E Binary
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: always()
      - name: Build release binary
        run: SKIP_FRONTEND_BUILD=1 cargo build --release --bin bifrost
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release/bifrost
          retention-days: 1

  e2e-rules:
    name: E2E Rules Tests
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_RULE_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "1"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh

  e2e-shell:
    name: E2E Shell Tests
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_SHELL_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "1"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E shell tests
        shell: bash
        run: bash scripts/ci/run-e2e-shell.sh

  e2e-runner:
    name: E2E Runner Tests
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_RUNNER_JOBS: "8"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "1"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: E2E runner tests
        shell: bash
        run: bash scripts/ci/run-e2e-runner.sh

  build-linux:
    name: Linux Build Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-target-builds
      - name: Build Linux workspace
        run: cargo build --workspace --release --target x86_64-unknown-linux-gnu
      - name: Build Linux CLI (aarch64)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-aarch64
        run: cross build -p bifrost-cli --release --target aarch64-unknown-linux-gnu
      - name: Build Linux CLI (armv7)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-armv7
        run: cross build -p bifrost-cli --release --target armv7-unknown-linux-gnueabihf

  build-desktop-platform:
    name: Desktop Platform Pipeline (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle_ext: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundle_ext: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-platform-${{ matrix.target }}
          save-if: always()
      - name: Unit and integration tests
        run: cargo test --workspace --all-features
      - name: Build workspace
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Build desktop frontend
        run: pnpm --dir web run build:desktop
      - name: Prepare desktop sidecar
        run: node scripts/prepare-tauri-sidecar.mjs release ${{ matrix.target }}
      - name: Resolve macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          echo "Using ad-hoc signing for macOS desktop CI bundle validation."
      - name: Build macOS desktop bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: pnpm exec tauri build --config desktop/src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles app
      - name: Re-sign macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          bash scripts/resign-macos-app.sh "${APP_PATH}"
      - name: Package macOS desktop dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          ARCH_SUFFIX=$( [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]] && echo x64 || echo aarch64 )
          DMG_PATH="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Bifrost_ci_${ARCH_SUFFIX}.dmg"
          bash scripts/package-macos-dmg.sh "${APP_PATH}" "${DMG_PATH}"
      - name: Validate macOS desktop bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          APP_PATH=$(find "desktop/src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          DMG_PATH=$(find "desktop/src-tauri/target/${TARGET}/release/bundle" -type f -name "*.dmg" | head -n 1)
          if [[ -z "${DMG_PATH}" ]]; then
            echo "macOS dmg bundle not found"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "${APP_PATH}"
          mkdir -p dist
          cp "${DMG_PATH}" "dist/bifrost-desktop-${TARGET}.dmg"
      - name: Upload macOS desktop bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-desktop-${{ matrix.target }}
          path: dist/bifrost-desktop-${{ matrix.target }}.dmg
          if-no-files-found: error
      - name: Check desktop client
        if: runner.os != 'macOS'
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
