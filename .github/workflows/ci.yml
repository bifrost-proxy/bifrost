name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cross.toml"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "packages/**"
      - "e2e-tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cross.toml"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "packages/**"
      - "e2e-tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: E2E shell CI coverage guard
        shell: bash
        run: bash scripts/ci/check-e2e-shell-ci-coverage.sh
      - name: macOS Shell capability shard balance guard
        shell: bash
        run: >-
          BIFROST_E2E_CAPABILITY_SHARDS=1
          BIFROST_E2E_SHELL_JOBS=2
          bash scripts/run_all_e2e.sh --ci --full-shell --skip-rules
          --skip-runner --skip-ui --skip-build --shard 1/3
          --check-shell-shard-balance
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install Shell quality tools
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
      - name: Shell syntax and static quality guard
        shell: bash
        env:
          SHELL_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: bash scripts/ci/check-shell-quality.sh "$SHELL_BASE_REF"
      - name: Proxy E2E capability contract
        run: python3 scripts/ci/check-e2e-capabilities.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

  clippy:
    name: Rust Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  dependency-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency audit tools
        run: |
          cargo install --locked cargo-deny --version 0.19.6
          cargo install --locked cargo-udeps --version 0.1.61
      - name: Rust dependency audit
        shell: bash
        run: bash scripts/ci/rust-dependency-audit.sh

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ true }}
      - name: Unit and integration tests
        run: cargo test --workspace --all-features

  coverage:
    name: Coverage (Unit + Proxy E2E) & 90% Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ true }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage tooling unit tests
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v
      - name: Collect unit + proxy E2E coverage and enforce gate
        # Per-crate floors + workspace floor live in
        # scripts/ci/coverage-thresholds.toml. The gate fails the job if any
        # crate drops below its ratcheted floor (goal: 90%).
        run: >-
          bash scripts/ci/coverage-all.sh --with-e2e --e2e-suite proxy
          --json --lcov --gate --gaps
      - name: Changed production Rust line coverage (95%)
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: >-
          python3 scripts/ci/coverage-diff.py target/coverage/lcov.info
          --base-ref "$COVERAGE_BASE_REF" --threshold 95
          --json-output target/coverage/changed-lines.json
      - name: Coverage summary (job summary)
        if: always()
        run: |
          python3 scripts/ci/coverage-gate.py target/coverage/coverage.json \
            --markdown --no-gate >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-linux
          path: |
            target/coverage/coverage.json
            target/coverage/lcov.info
            target/coverage/production-coverage.json
            target/coverage/changed-lines.json
          retention-days: 7

  build-e2e:
    name: Build E2E Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ true }}
      - name: Build release binary
        run: cargo build --release --bin bifrost
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release/bifrost
          retention-days: 1

  e2e-rules:
    name: E2E Rules (Linux)
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-shell:
    name: E2E Shell (Linux)
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_SHELL_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      # Unit/Integration and Coverage both execute the HTTP/3 Rust integration
      # test. Shell E2E keeps the real proxy scenarios without rebuilding the
      # full test-only dependency graph from a cold cache.
      SKIP_CARGO_TEST: "true"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers (chromium headless shell)
        run: pnpm exec playwright install --with-deps chromium-headless-shell
        working-directory: web
      - name: Install sync-server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/bifrost-sync-server
      - name: Build sync-server (TypeScript -> dist/cli.js)
        run: pnpm run build
        working-directory: packages/bifrost-sync-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E shell tests
        shell: bash
        run: bash scripts/ci/run-e2e-shell.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-logs-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-runner:
    name: E2E Runner (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RUNNER_JOBS: "8"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: E2E runner tests
        shell: bash
        run: bash scripts/ci/run-e2e-runner.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runner-logs-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-ui:
    name: E2E UI (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-ui-test
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports/ui
      BIFROST_SYNC_DISABLE_AUTO_LOGIN_PROMPT: "1"
      BIFROST_DISABLE_TRAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium-headless-shell
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ true }}
      - name: Run critical Playwright capability matrix through unified E2E entrypoint
        shell: bash
        env:
          BIFROST_UI_TEST_PROFILE: critical
        run: >-
          bash scripts/run_all_e2e.sh --ci --skip-rules --skip-shell
          --skip-runner
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-playwright-report-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/ui/
            ${{ github.workspace }}/web/playwright-report/
            ${{ github.workspace }}/web/test-results/
            ${{ github.workspace }}/.ui-backend.log
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  build-linux-x86:
    name: Linux Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
      - name: Build Linux workspace
        run: cargo build --workspace --release --target x86_64-unknown-linux-gnu

  build-linux-aarch64:
    name: Linux Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64
      - name: Build Linux CLI (aarch64)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-aarch64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: |
          for attempt in 1 2 3; do
            echo "cross build attempt ${attempt}/3"
            if cross build -p bifrost-cli --release --target aarch64-unknown-linux-gnu; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  build-linux-armv7:
    name: Linux Build (armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-armv7
      - name: Build Linux CLI (armv7)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-armv7
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: |
          for attempt in 1 2 3; do
            echo "cross build attempt ${attempt}/3"
            if cross build -p bifrost-cli --release --target armv7-unknown-linux-gnueabihf; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  build-linux-musl-x86:
    name: Linux Build (x86_64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-x86_64
      - name: Build Linux CLI (x86_64-musl)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-musl-x86_64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: |
          for attempt in 1 2 3; do
            echo "cross build attempt ${attempt}/3"
            if cross build -p bifrost-cli --release --target x86_64-unknown-linux-musl; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  build-linux-musl-aarch64:
    name: Linux Build (aarch64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-aarch64
      - name: Build Linux CLI (aarch64-musl)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-musl-aarch64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: |
          for attempt in 1 2 3; do
            echo "cross build attempt ${attempt}/3"
            if cross build -p bifrost-cli --release --target aarch64-unknown-linux-musl; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  build-cli-macos-aarch64:
    name: Build macOS CLI (aarch64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Rust toolchain with retry
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
            export PATH="${cargo_home}/bin:${PATH}"
          fi

          target="aarch64-apple-darwin"
          for attempt in 1 2 3; do
            echo "Installing stable Rust toolchain for ${target} (attempt ${attempt}/3)"
            if rustup toolchain install stable --target "${target}" --profile minimal --no-self-update; then
              rustup default stable
              exit 0
            fi

            if [[ "${attempt}" == "3" ]]; then
              echo "Failed to install stable Rust toolchain for ${target} after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 20))"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-aarch64-apple-darwin
          save-if: ${{ true }}
      - name: Cache sherpa-onnx archive
        # ASR native runtime assets are supported only on Apple Silicon macOS.
        # Windows/Linux CI must not fetch or bundle sherpa/qwen ASR artifacts.
        uses: actions/cache@v4
        with:
          path: .ci-cache/sherpa-onnx
          key: sherpa-onnx-${{ hashFiles('Cargo.lock') }}-aarch64-apple-darwin
          restore-keys: |
            sherpa-onnx-${{ hashFiles('Cargo.lock') }}-
            sherpa-onnx-
      - name: Prepare sherpa-onnx archive
        # Keep ASR runtime preparation target-gated to aarch64-apple-darwin.
        shell: bash
        run: bash scripts/ci/prepare-sherpa-onnx-archive.sh aarch64-apple-darwin
      - name: Build CLI
        run: cargo build -p bifrost-cli --release --target aarch64-apple-darwin
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bifrost
          retention-days: 1

  build-cli-macos-x86_64:
    name: Build macOS CLI (x86_64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain with retry
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
            export PATH="${cargo_home}/bin:${PATH}"
          fi

          target="x86_64-apple-darwin"
          for attempt in 1 2 3; do
            echo "Installing stable Rust toolchain for ${target} (attempt ${attempt}/3)"
            if rustup toolchain install stable --target "${target}" --profile minimal --no-self-update; then
              rustup default stable
              exit 0
            fi

            if [[ "${attempt}" == "3" ]]; then
              echo "Failed to install stable Rust toolchain for ${target} after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 20))"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-x86_64-apple-darwin
          save-if: ${{ true }}
      - name: Build CLI
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: cargo build -p bifrost-cli --release --target x86_64-apple-darwin
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/bifrost
          retention-days: 1

  e2e-macos-rules:
    name: E2E Rules (aarch64-apple-darwin)
    needs: [build-cli-macos-aarch64]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-aarch64-apple-darwin
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-aarch64-apple-darwin
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-macos-shell:
    name: E2E Shell (aarch64-apple-darwin, ${{ matrix.capability }})
    needs: [build-cli-macos-aarch64]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            capability: proxy-core
          - shard: 2
            capability: remote
          - shard: 3
            capability: agent-extensions
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_SHELL_JOBS: "2"
      BIFROST_E2E_SHARD_INDEX: ${{ matrix.shard }}
      BIFROST_E2E_SHARD_TOTAL: "3"
      BIFROST_E2E_CAPABILITY_SHARDS: "1"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      BIFROST_E2E_SHELL_TEST_TIMEOUT: "1260"
      # Unit/Integration and Coverage already compile and execute the HTTP/3
      # Rust integration test. macOS still runs the real proxy scenarios without
      # spending 10+ minutes rebuilding test-only dependencies.
      SKIP_CARGO_TEST: "true"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers (chromium headless shell)
        run: pnpm exec playwright install chromium-headless-shell
        working-directory: web
      - name: Install sync-server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/bifrost-sync-server
      - name: Build sync-server (TypeScript -> dist/cli.js)
        run: pnpm run build
        working-directory: packages/bifrost-sync-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-aarch64-apple-darwin
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E shell tests
        shell: bash
        run: bash scripts/ci/run-e2e-shell.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-logs-aarch64-apple-darwin-${{ matrix.capability }}
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-macos-runner:
    name: E2E Runner (aarch64-apple-darwin)
    needs: [build-cli-macos-aarch64]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RUNNER_JOBS: "8"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-aarch64-apple-darwin
      - name: Cache sherpa-onnx archive
        # Tray smoke tests on macOS arm64 can coexist with ASR assets, but the
        # ASR runtime remains unsupported and unprepared on Windows/Linux jobs.
        uses: actions/cache@v4
        with:
          path: .ci-cache/sherpa-onnx
          key: sherpa-onnx-${{ hashFiles('Cargo.lock') }}-aarch64-apple-darwin
          restore-keys: |
            sherpa-onnx-${{ hashFiles('Cargo.lock') }}-
            sherpa-onnx-
      - name: Prepare sherpa-onnx archive
        # Keep ASR runtime preparation target-gated to aarch64-apple-darwin.
        shell: bash
        run: bash scripts/ci/prepare-sherpa-onnx-archive.sh aarch64-apple-darwin
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: Tray startup smoke test
        timeout-minutes: 10
        shell: bash
        env:
          BIFROST_BIN: ${{ github.workspace }}/target/release/bifrost
          SKIP_BUILD: "true"
        run: bash e2e-tests/tests/test_cli_tray_startup_ci.sh
      - name: E2E runner tests
        shell: bash
        run: bash scripts/ci/run-e2e-runner.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runner-logs-aarch64-apple-darwin
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  bundle-desktop-macos:
    name: Bundle macOS (${{ matrix.target }})
    needs: [build-cli-macos-aarch64, build-cli-macos-x86_64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Install Rust toolchain with retry
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
            export PATH="${cargo_home}/bin:${PATH}"
          fi

          target="${{ matrix.target }}"
          for attempt in 1 2 3; do
            echo "Installing stable Rust toolchain for ${target} (attempt ${attempt}/3)"
            if rustup toolchain install stable --target "${target}" --profile minimal --no-self-update; then
              rustup default stable
              exit 0
            fi

            if [[ "${attempt}" == "3" ]]; then
              echo "Failed to install stable Rust toolchain for ${target} after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 20))"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-bundle-${{ matrix.target }}
      - name: Download workspace binaries
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Make binary executable
        run: chmod +x target/${{ matrix.target }}/release/bifrost
      - name: Build desktop frontend
        run: pnpm --dir web run build:desktop
      - name: Prepare desktop sidecar
        run: node scripts/prepare-tauri-sidecar.mjs release ${{ matrix.target }}
      - name: Resolve macOS signing mode
        shell: bash
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          echo "Using ad-hoc signing for macOS desktop CI bundle validation."
      - name: Verify Rust tool paths
        shell: bash
        run: |
          cargo --version
          rustc --version
      - name: Build macOS desktop bundle
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          pnpm exec tauri build --config desktop/src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles app
      - name: Re-sign macOS app bundle
        shell: bash
        run: |
          APP_PATH=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          bash scripts/resign-macos-app.sh "${APP_PATH}"
      - name: Package macOS desktop dmg
        shell: bash
        run: |
          APP_PATH=$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          ARCH_SUFFIX=$( [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]] && echo x64 || echo aarch64 )
          DMG_PATH="desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Bifrost_ci_${ARCH_SUFFIX}.dmg"
          bash scripts/package-macos-dmg.sh "${APP_PATH}" "${DMG_PATH}"
      - name: Validate macOS desktop bundle
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          APP_PATH=$(find "desktop/src-tauri/target/${TARGET}/release/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)
          if [[ -z "${APP_PATH}" ]]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          DMG_PATH=$(find "desktop/src-tauri/target/${TARGET}/release/bundle" -type f -name "*.dmg" | head -n 1)
          if [[ -z "${DMG_PATH}" ]]; then
            echo "macOS dmg bundle not found"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "${APP_PATH}"
          mkdir -p dist
          cp "${DMG_PATH}" "dist/bifrost-desktop-${TARGET}.dmg"
      - name: Upload macOS desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-desktop-${{ matrix.target }}
          path: dist/bifrost-desktop-${{ matrix.target }}.dmg
          if-no-files-found: error

  build-cli-windows:
    name: Build Windows CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-${{ matrix.target }}
          save-if: ${{ true }}
      - name: Build CLI
        run: cargo build -p bifrost-cli --release --target ${{ matrix.target }}
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bifrost.exe
          retention-days: 1

  build-desktop-windows:
    name: Build Windows (${{ matrix.target }})
    needs: [build-cli-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows-${{ matrix.target }}
          save-if: ${{ true }}
      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
      - name: Build desktop frontend
        run: pnpm --dir web run build:desktop
      - name: Prepare desktop sidecar
        run: node scripts/prepare-tauri-sidecar.mjs release ${{ matrix.target }}
      - name: Check desktop client
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}

  e2e-windows-shell:
    name: E2E Shell (x86_64-pc-windows-msvc)
    needs: [build-cli-windows]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_SYNC_DISABLE_AUTO_LOGIN_PROMPT: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download current PR binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-x86_64-pc-windows-msvc
          path: target/release
      - name: E2E upgrade restart with Windows self-update replacement
        shell: bash
        env:
          BIFROST_BIN: ${{ github.workspace }}/target/release/bifrost.exe
          BIFROST_UPGRADE_E2E_START_WITH_INSTALL_BIN: "1"
          BIFROST_UPGRADE_TEST_ALLOW_RELEASE_OVERRIDES: "1"
          # No BIFROST_UPGRADE_E2E_VERSION override: the test derives the upgrade
          # target from the workspace version (patch + 1) to avoid version collisions.
        run: bash e2e-tests/tests/test_upgrade_local_restart_e2e.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          echo "=== Upgrade helper logs ==="
          find target old-release -type f -name ".bifrost-upgrade-*.log" -print -exec cat {} \; 2>/dev/null || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-logs-x86_64-pc-windows-msvc-upgrade-restart
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
            ${{ github.workspace }}/target/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-windows-rules:
    name: E2E Rules (${{ matrix.target }}, shard ${{ matrix.rule_shard }})
    needs: [build-cli-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "1/4"
            rule_shard_index: "1"
            rule_shard_total: "4"
            suite_timeout: "1260"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "2/4"
            rule_shard_index: "2"
            rule_shard_total: "4"
            suite_timeout: "1260"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "3/4"
            rule_shard_index: "3"
            rule_shard_total: "4"
            suite_timeout: "1260"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "4/4"
            rule_shard_index: "4"
            rule_shard_total: "4"
            suite_timeout: "1260"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "2"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      BIFROST_E2E_RULE_SHARD_INDEX: ${{ matrix.rule_shard_index }}
      BIFROST_E2E_RULE_SHARD_TOTAL: ${{ matrix.rule_shard_total }}
      BIFROST_E2E_FIXTURE_TIMEOUT: ${{ matrix.fixture_timeout }}
      BIFROST_E2E_TLS_READY_TIMEOUT: ${{ matrix.tls_ready_timeout }}
      BIFROST_E2E_RETRY_FIXTURE_TIMEOUT: "60"
      BIFROST_E2E_RETRY_BUDGET_SECS: "180"
      BIFROST_E2E_MAX_RETRY_SUITES: "6"
      BIFROST_E2E_SUITE_TIMEOUT: ${{ matrix.suite_timeout }}
      BIFROST_E2E_RULE_RUNNER_TIMEOUT: "1200"
      BIFROST_E2E_HEARTBEAT_INTERVAL: "30"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.target }}
      - name: Install jq
        shell: powershell
        run: choco install jq -y
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/release
      - name: Verify binary
        shell: bash
        run: |
          echo "=== Downloaded files ==="
          ls -la target/release/ || true
          echo "=== Version check ==="
          target/release/bifrost.exe --version 2>&1 || echo "bifrost.exe --version failed"
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-${{ matrix.target }}-shard-${{ matrix.rule_shard_index }}-of-${{ matrix.rule_shard_total }}
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-windows-runner:
    name: E2E Runner (${{ matrix.target }})
    needs: [build-cli-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runner_jobs: "8"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            runner_jobs: "2"
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RUNNER_JOBS: ${{ matrix.runner_jobs }}
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.target }}
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/release
      - name: Tray startup smoke test
        timeout-minutes: 10
        shell: bash
        env:
          BIFROST_BIN: ${{ github.workspace }}/target/release/bifrost.exe
          BIFROST_TRAY_STARTUP_ALLOW_LOG_ONLY: "1"
          SKIP_BUILD: "true"
        run: bash e2e-tests/tests/test_cli_tray_startup_ci.sh
      - name: E2E runner tests
        shell: bash
        run: bash scripts/ci/run-e2e-runner.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runner-logs-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  test-windows-tray:
    name: Windows Unit Tests (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-windows
          save-if: ${{ false }}
      - name: Run Windows unit tests
        # This intentionally verifies Windows can compile/test the workspace
        # without ASR native runtime assets; bifrost-asr full local engines are
        # target-gated to macOS aarch64 and must stay unavailable here.
        shell: bash
        run: |
          cargo test --workspace --all-features --target x86_64-pc-windows-msvc -- --skip test_https_interception_websocket_applies_request_and_response_header_rules
          cargo test -p bifrost-tests --test https_proxy_test --all-features --target x86_64-pc-windows-msvc test_https_interception_websocket_applies_request_and_response_header_rules -- --test-threads=1
