name: CI

on:
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "packages/**"
      - "e2e-tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "desktop/**"
      - "scripts/**"
      - "web/**"
      - "packages/**"
      - "e2e-tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all -- --check

  clippy:
    name: Rust Clippy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  dependency-audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency audit tools
        run: |
          cargo install --locked cargo-deny --version 0.19.6
          cargo install --locked cargo-udeps --version 0.1.61
      - name: Rust dependency audit
        shell: bash
        run: bash scripts/ci/rust-dependency-audit.sh

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: always()
      - name: Unit and integration tests
        run: cargo test --workspace --all-features

  build-e2e:
    name: Build E2E Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: always()
      - name: Build release binary
        run: cargo build --release --bin bifrost
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release/bifrost
          retention-days: 1

  e2e-rules:
    name: E2E Rules (Linux)
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-shell:
    name: E2E Shell (Linux, shard ${{ matrix.shard }}/3)
    needs: [build-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_SHELL_JOBS: "4"
      BIFROST_E2E_SHARD_INDEX: ${{ matrix.shard }}
      BIFROST_E2E_SHARD_TOTAL: "3"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers (chromium headless shell)
        run: pnpm exec playwright install --with-deps chromium-headless-shell
        working-directory: web
      - name: Install sync-server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/bifrost-sync-server
      - name: Build sync-server (TypeScript -> dist/cli.js)
        run: pnpm run build
        working-directory: packages/bifrost-sync-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-linux
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E shell tests
        shell: bash
        run: bash scripts/ci/run-e2e-shell.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shell-logs-linux-shard-${{ matrix.shard }}
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-runner:
    name: E2E Runner (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RUNNER_JOBS: "8"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: E2E runner tests
        shell: bash
        run: bash scripts/ci/run-e2e-runner.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runner-logs-linux
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  build-linux-x86:
    name: Linux Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
      - name: Build Linux workspace
        run: cargo build --workspace --release --target x86_64-unknown-linux-gnu

  build-linux-aarch64:
    name: Linux Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-aarch64
      - name: Build Linux CLI (aarch64)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-aarch64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: cross build -p bifrost-cli --release --target aarch64-unknown-linux-gnu

  build-linux-armv7:
    name: Linux Build (armv7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-armv7
      - name: Build Linux CLI (armv7)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-armv7
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: cross build -p bifrost-cli --release --target armv7-unknown-linux-gnueabihf

  build-linux-musl-x86:
    name: Linux Build (x86_64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-x86_64
      - name: Build Linux CLI (x86_64-musl)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-musl-x86_64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: cross build -p bifrost-cli --release --target x86_64-unknown-linux-musl

  build-linux-musl-aarch64:
    name: Linux Build (aarch64-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-musl-aarch64
      - name: Build Linux CLI (aarch64-musl)
        env:
          SKIP_FRONTEND_BUILD: "1"
          CARGO_TARGET_DIR: target/cross-musl-aarch64
          CROSS_CONTAINER_ENGINE_NO_BUILDKIT: "1"
        run: |
          for attempt in 1 2 3; do
            echo "cross build attempt ${attempt}/3"
            if cross build -p bifrost-cli --release --target aarch64-unknown-linux-musl; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

  build-cli-macos-aarch64:
    name: Build macOS CLI (aarch64-apple-darwin)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-aarch64-apple-darwin
          save-if: always()
      - name: Build CLI
        run: cargo build -p bifrost-cli --release --target aarch64-apple-darwin
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bifrost
          retention-days: 1

  build-cli-macos-x86_64:
    name: Build macOS CLI (x86_64-apple-darwin)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-build-x86_64-apple-darwin
          save-if: always()
      - name: Build CLI
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: cargo build -p bifrost-cli --release --target x86_64-apple-darwin
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-release-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/bifrost
          retention-days: 1

  e2e-macos-rules:
    name: E2E Rules (aarch64-apple-darwin)
    needs: [build-cli-macos-aarch64]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "4"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-aarch64-apple-darwin
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-aarch64-apple-darwin
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  e2e-macos-shell:
    name: E2E Shell (aarch64-apple-darwin, shard ${{ matrix.shard }}/3)
    needs: [build-cli-macos-aarch64]
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_SHELL_JOBS: "2"
      BIFROST_E2E_SHARD_INDEX: ${{ matrix.shard }}
      BIFROST_E2E_SHARD_TOTAL: "3"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers (chromium headless shell)
        run: pnpm exec playwright install chromium-headless-shell
        working-directory: web
      - name: Install sync-server dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/bifrost-sync-server
      - name: Build sync-server (TypeScript -> dist/cli.js)
        run: pnpm run build
        working-directory: packages/bifrost-sync-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-aarch64-apple-darwin
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-aarch64-apple-darwin
          path: target/release
      - name: Make binary executable
        run: chmod +x target/release/bifrost
      - name: E2E shell tests
        shell: bash
        run: bash scripts/ci/run-e2e-shell.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
