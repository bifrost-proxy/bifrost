  e2e-windows-rules:
    name: E2E Rules (${{ matrix.target }}, shard ${{ matrix.rule_shard }})
    needs: [build-cli-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "1/4"
            rule_shard_index: "1"
            rule_shard_total: "4"
            suite_timeout: "1080"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "2/4"
            rule_shard_index: "2"
            rule_shard_total: "4"
            suite_timeout: "1080"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "3/4"
            rule_shard_index: "3"
            rule_shard_total: "4"
            suite_timeout: "1080"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rule_shard: "4/4"
            rule_shard_index: "4"
            rule_shard_total: "4"
            suite_timeout: "1080"
            fixture_timeout: "90"
            tls_ready_timeout: "90"
    env:
      BIFROST_DATA_DIR: ${{ github.workspace }}/.bifrost-e2e-ci
      BIFROST_E2E_REPORT_DIR: ${{ github.workspace }}/.e2e-reports
      BIFROST_E2E_RULE_JOBS: "2"
      BIFROST_E2E_RETRY_FAILED_ONCE: "1"
      BIFROST_E2E_HTTP_RETRIES: "2"
      BIFROST_E2E_RULE_SHARD_INDEX: ${{ matrix.rule_shard_index }}
      BIFROST_E2E_RULE_SHARD_TOTAL: ${{ matrix.rule_shard_total }}
      BIFROST_E2E_FIXTURE_TIMEOUT: ${{ matrix.fixture_timeout }}
      BIFROST_E2E_TLS_READY_TIMEOUT: ${{ matrix.tls_ready_timeout }}
      BIFROST_E2E_RETRY_FIXTURE_TIMEOUT: "60"
      BIFROST_E2E_RETRY_BUDGET_SECS: "180"
      BIFROST_E2E_MAX_RETRY_SUITES: "6"
      BIFROST_E2E_SUITE_TIMEOUT: ${{ matrix.suite_timeout }}
      TIMEOUT: "90"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.target }}
      - name: Install jq
        shell: powershell
        run: choco install jq -y
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: bifrost-release-${{ matrix.target }}
          path: target/release
      - name: Verify binary
        shell: bash
        run: |
          echo "=== Downloaded files ==="
          ls -la target/release/ || true
          echo "=== Version check ==="
          target/release/bifrost.exe --version 2>&1 || echo "bifrost.exe --version failed"
      - name: E2E rules tests
        shell: bash
        run: bash scripts/ci/run-e2e-rules.sh
      - name: Dump failed suite logs
        if: failure()
        shell: bash
        run: |
          echo "=== E2E Report Directory ==="
          find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
          echo ""
          for logfile in $(find "$BIFROST_E2E_REPORT_DIR" -type f -name "*.log" 2>/dev/null | head -10 || true); do
            echo "=== $logfile ==="
            tail -100 "$logfile"
            echo ""
          done
          echo "=== E2E Data Directory ==="
          find "$BIFROST_DATA_DIR" -type f -name "*.log" 2>/dev/null | head -20 || true
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rules-logs-${{ matrix.target }}-shard-${{ matrix.rule_shard_index }}-of-${{ matrix.rule_shard_total }}
          path: |
            ${{ github.workspace }}/.e2e-reports/
            ${{ github.workspace }}/.bifrost-e2e-ci/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

