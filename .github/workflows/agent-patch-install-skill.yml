name: Agent Patch Install Skill

on:
  push:
    branches:
      - agent/simplify-skill-install-targets
    paths:
      - .github/workflows/agent-patch-install-skill.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-skill-install-targets
      - name: Patch install-skill CLI metadata and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli = Path("crates/bifrost-cli/src/cli.rs")
          text = cli.read_text()
          old_about = 'about = "Install bifrost SKILL.md to AI coding tools (Claude Code, Codex, Trae, Cursor, GitHub Copilot, and standard Agent Skills runtimes)"'
          new_about = 'about = "Install bifrost SKILL.md to standard Agent Skills and Claude Code directories"'
          if old_about not in text:
              raise SystemExit("install-skill about text not found")
          text = text.replace(old_about, new_about, 1)

          old_values = '''            value_parser = [
                "claude-code",
                "codex",
                "trae",
                "cursor",
                "github-copilot",
                "universal",
                "all"
            ],
            help = "Target tool: claude-code, codex, trae, cursor, github-copilot, universal, or 'all' (default: all)"'''
          new_values = '''            value_parser = ["claude-code", "universal", "all"],
            help = "Target skill directory: universal (.agents/skills), claude-code (.claude/skills), or 'all' (default: all)"'''
          if old_values not in text:
              raise SystemExit("install-skill value parser block not found")
          cli.write_text(text.replace(old_values, new_values, 1))

          tests = Path("crates/bifrost-cli/tests/cli_commands.rs")
          text = tests.read_text()
          old_completion = '''    assert!(
        completions.contains("claude-code")
            && completions.contains("codex")
            && completions.contains("cursor")
            && completions.contains("trae")
            && completions.contains("github-copilot")
            && completions.contains("universal"),
        "completions should include install-skill tool values"
    );'''
          new_completion = '''    assert!(
        completions.contains("claude-code")
            && completions.contains("universal")
            && completions.contains("all"),
        "completions should include supported install-skill target values"
    );'''
          if old_completion not in text:
              raise SystemExit("install-skill completion assertion not found")
          text = text.replace(old_completion, new_completion, 1)

          old_help = '''    assert!(
        help.contains("github-copilot"),
        "install-skill help should include github-copilot target"
    );
    assert!(
        help.contains("universal"),
        "install-skill help should include universal target"
    );'''
          new_help = '''    assert!(
        help.contains("claude-code"),
        "install-skill help should include claude-code target"
    );
    assert!(
        help.contains("universal"),
        "install-skill help should include universal target"
    );'''
          if old_help not in text:
              raise SystemExit("install-skill help assertions not found")
          text = text.replace(old_help, new_help, 1)

          old_call = '        Some("codex".to_string()),\n        Some(target_dir.clone()),'
          new_call = '        Some("universal".to_string()),\n        Some(target_dir.clone()),'
          if old_call not in text:
              raise SystemExit("install-skill codex test call not found")
          tests.write_text(text.replace(old_call, new_call, 1))
          PY

          cargo fmt --all
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/bifrost-cli/src/cli.rs crates/bifrost-cli/tests/cli_commands.rs
          git commit -m "align install-skill CLI targets"
          git push origin HEAD:agent/simplify-skill-install-targets
