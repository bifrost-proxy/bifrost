name: Bifrost
options:
  bundleIdPrefix: com.bifrost
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  Bifrost:
    path: .
targets:
  BifrostNativeCore:
    type: framework
    platform: macOS
    sources:
      - Sources/BifrostNativeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bifrost.native.mac.core
  Bifrost:
    type: application
    platform: macOS
    sources:
      - Sources/Bifrost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bifrost.native.mac
        PRODUCT_NAME: Bifrost
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: BifrostNativeCore
  BifrostNativeCoreChecks:
    type: tool
    platform: macOS
    sources:
      - Sources/BifrostNativeCoreChecks
    dependencies:
      - target: BifrostNativeCore
